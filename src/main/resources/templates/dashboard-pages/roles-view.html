<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    .card{
        border-radius:10px;
        box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .label{
        font-weight:600;
        color:#334155;
    }

    .value{
        color:#0f172a;
    }

    .status-active{
        color:#16a34a;
        font-weight:600;
    }

    .status-inactive{
        color:#dc2626;
        font-weight:600;
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-3">

    <h4>View Role</h4>

</div>

<div class="card p-4">

    <div class="row mb-3">

        <div class="col-md-3 label">
            Role ID
        </div>

        <div class="col-md-9 value"
             th:text="${role.roleId}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-3 label">
            Role Name
        </div>

        <div class="col-md-9 value"
             th:text="${role.roleName}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-3 label">
            Description
        </div>

        <div class="col-md-9 value"
             th:text="${role.description != null ? role.description : '-'}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-3 label">
            Status
        </div>

        <div class="col-md-9">

            <span th:text="${role.isActive} ? 'Active' : 'Inactive'"
                  th:classappend="${role.isActive} ? 'status-active' : 'status-inactive'">
            </span>

        </div>

    </div>

    <div class="mt-4">

        <button class="btn btn-secondary"
                onclick="window.location.href='/roles'">
            Back

        </button>

    </div>

</div>
