<link rel="stylesheet"
      href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css"
      xmlns:th="http://www.w3.org/1999/xhtml">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    .card{
     border-radius:10px;
     box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    #userTable{
     border:1px solid #dee2e6;
     border-radius:8px;
     overflow:hidden;
    }

    #userTable th{
     background:#f1f5f9;
     border-bottom:1px solid #dee2e6;
    }

    #userTable td{
     border-top:1px solid #dee2e6;
     padding:12px 16px;
     vertical-align: middle;
    }

    .dt-buttons{
        margin-bottom:10px;
    }
</style>

<div class="d-flex justify-content-between">
    <h4>Users</h4>

    <button class="btn btn-primary mb-3"
            onclick="window.location.href='/users/create'">
        Create
    </button>
</div>

<div class="card p-3">

    <table id="userTable" class="table">

        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="u : ${users}">

            <td th:text="${u.userId}"></td>

            <td th:text="${u.username}"></td>

            <td th:text="${u.role != null ? u.role.roleName : '-'}"></td>

            <td>
<span th:text="${u.accountStatus == 'ACTIVE'} ? 'Active' : 'Inactive'"
      th:classappend="${u.accountStatus == 'ACTIVE'} ? 'text-success fw-semibold' : 'text-danger fw-semibold'">
</span>
            </td>

            <td>

                <div class="d-flex gap-2">

                    <!-- View -->
                    <button class="btn btn-primary btn-sm"
                            th:onclick="'window.location.href=\'/users/view/' + ${u.userId} + '\';'">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                    <!-- Edit -->
                    <button class="btn btn-warning btn-sm"
                            th:onclick="'window.location.href=\'/users/edit/' + ${u.userId} + '\';'">

                        <i class="fa-solid fa-pen"></i>

                    </button>

                    <!-- Toggle -->
                    <button th:if="${u.accountStatus == 'ACTIVE'}"
                            class="btn btn-danger btn-sm"
                            th:onclick="'window.location.href=\'/users/toggle/' + ${u.userId} + '\';'"
                            title="Deactivate">

                        <i class="fa-solid fa-trash"></i>

                    </button>

                    <button th:if="${u.accountStatus != 'ACTIVE'}"
                            class="btn btn-success btn-sm"
                            th:onclick="'window.location.href=\'/users/toggle/' + ${u.userId} + '\';'"
                            title="Activate">

                        <i class="fa-solid fa-check"></i>

                    </button>

                </div>

            </td>

        </tr>

        </tbody>

    </table>

</div>
<script>
<!--    $(function(){-->
<!--     $('#userTable').DataTable();-->
<!--    });-->

    $(function () {

    $('#userTable').DataTable({

        dom: '<"d-flex justify-content-end mb-2"B>frtip',

        buttons: [
            {
                extend: 'excelHtml5',
                text: '<i class="fa fa-file-excel"></i> Export Excel',
                className: 'btn btn-success btn-sm',
                title: 'Users_List',
                exportOptions: {
                    columns: [0,1,2,3] // ignore Actions column
                }
            }
        ]

    });

});
</script>
