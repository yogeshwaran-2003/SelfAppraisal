<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    .card{
     border-radius:10px;
     box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .label{
     font-weight:600;
     color:#64748b;
    }

    .value{
     font-weight:500;
    }

    .status-active{
     color:#16a34a;
     font-weight:600;
    }

    .status-inactive{
     color:#dc2626;
     font-weight:600;
    }
</style>


<div class="d-flex justify-content-between align-items-center mb-3">

    <h4>User Details</h4>

    <button class="btn btn-secondary"
            onclick="window.location.href='/users'">

        <i class="fa-solid fa-arrow-left"></i> Back

    </button>

</div>

<div class="card p-4">

    <div class="row mb-3">

        <div class="col-md-4 label">User ID</div>

        <div class="col-md-8 value"
             th:text="${user.userId}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-4 label">Username</div>

        <div class="col-md-8 value"
             th:text="${user.username}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-4 label">Role</div>

        <div class="col-md-8 value"
             th:text="${user.role != null ? user.role.roleName : '-'}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-4 label">Account Status</div>

        <div class="col-md-8">

            <span th:text="${user.accountStatus}"
                  th:classappend="${user.accountStatus == 'ACTIVE'} ? 'status-active' : 'status-inactive'">
            </span>

        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-4 label">Created Date</div>

        <div class="col-md-8 value"
             th:text="${user.createdDate != null ? #temporals.format(user.createdDate, 'dd MMM yyyy HH:mm') : '-'}">
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-4 label">Updated Date</div>

        <div class="col-md-8 value"
             th:text="${user.updatedDate != null ? #temporals.format(user.updatedDate, 'dd MMM yyyy HH:mm') : '-'}">
        </div>

    </div>

</div>
