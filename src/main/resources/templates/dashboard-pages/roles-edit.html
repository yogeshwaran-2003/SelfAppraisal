<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    .card{
        border-radius:10px;
        box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .form-label{
        font-weight:500;
    }

    .required{
        color:red;
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-3">

    <h4>Edit Role</h4>

    <button class="btn btn-secondary"
            onclick="window.location.href='/roles'">
        Back
    </button>

</div>
<div class="card p-4">

    <form th:action="@{/roles/update}"
          th:object="${role}"
          method="post">

        <!-- Role ID hidden -->
        <input type="hidden" th:field="*{roleId}">

        <!-- Role Name -->
        <div class="mb-3">

            <label class="form-label">
                Role Name <span class="required">*</span>
            </label>

            <input type="text"
                   th:field="*{roleName}"
                   class="form-control"
                   required>

        </div>

        <!-- Description -->
        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea th:field="*{description}"
                      class="form-control"
                      rows="3"></textarea>

        </div>

        <!-- Status -->
        <div class="mb-3 form-check">

            <input type="checkbox"
                   th:field="*{isActive}"
                   class="form-check-input">

            <label class="form-check-label">
                Active
            </label>

        </div>

        <!-- Buttons -->
        <div class="mt-4">

            <button type="submit"
                    class="btn btn-primary">

                <i class="fa-solid fa-save"></i> Update

            </button>

            <button type="button"
                    class="btn btn-secondary"
                    onclick="window.location.href='/roles'">

                Cancel

            </button>

        </div>

    </form>

</div>
