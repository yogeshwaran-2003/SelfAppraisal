<style>
    .page-wrapper{
        max-width:1100px;
        margin:20px auto;
    }

    .card{
        border-radius:12px;
        padding:25px;
        background:#fff;
        box-shadow:0 4px 14px rgba(0,0,0,.08);
    }

    .section-title{
        font-size:18px;
        font-weight:600;
        margin-bottom:15px;
    }

    .btn-area{
        text-align:right;
        margin-bottom:15px;
    }

    .btn-sm{
        font-size:13px;
    }
</style>

<div class="page-wrapper">

    <div class="card">

        <div class="section-title">
            My Goals - <span th:text="${cycle.title}"></span>
        </div>

        <div class="btn-area" th:if="${!locked}">
            <a th:href="@{/appraisal/employee/goals/create}"
               class="btn btn-primary btn-sm">
                + Add Goal
            </a>
        </div>

        <div class="btn-area" th:if="${locked}">
            <span class="text-danger">
                Goals are locked after submission.
            </span>
        </div>

        <table class="table table-bordered table-hover">

            <thead class="table-light">
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th width="120">Weightage</th>
                <th width="150">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="g : ${goals}">
                <td th:text="${g.title}"></td>
                <td th:text="${g.description}"></td>
                <td th:text="${g.weightage + '%'}"></td>

                <td>
                    <div th:if="${!locked}">
                        <a th:href="@{'/appraisal/employee/goals/edit/' + ${g.id}}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{'/appraisal/employee/goals/delete/' + ${g.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure to delete this goal?')">
                            Delete
                        </a>
                    </div>

                    <div th:if="${locked}">
                        <span class="text-muted">Locked</span>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(goals)}">
                <td colspan="4" class="text-center">
                    No goals added yet for this cycle.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>
