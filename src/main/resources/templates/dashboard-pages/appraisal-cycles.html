<style>

    .page-wrapper{
        max-width:1100px;
        margin:20px auto;
    }

    .card{
        border-radius:12px;
        padding:25px;
        background:#fff;
        box-shadow:0 4px 14px rgba(0,0,0,.08);
    }

    .page-title{
        font-size:20px;
        font-weight:600;
        margin-bottom:20px;
    }

    .btn-area{
        text-align:right;
        margin-bottom:15px;
    }

    table{
        font-size:14px;
    }

</style>

<div class="page-wrapper">

    <div class="card">

        <div class="page-title">
            Appraisal Cycles
        </div>

        <div class="btn-area">
            <a th:href="@{/appraisal/admin/cycle/create}"
               class="btn btn-primary btn-sm">
                + Create Cycle
            </a>
        </div>

        <table class="table table-bordered table-hover">

            <thead class="table-light">
            <tr>
                <th>Cycle Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th width="120">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="c : ${cycles}">
                <td th:text="${c.title}"></td>
                <td th:text="${c.startDate}"></td>
                <td th:text="${c.endDate}"></td>
                <td>
                    <span th:text="${c.status}"
                          th:classappend="
                          ${c.status == 'OPEN'} ? 'badge bg-success' :
                          (${c.status == 'CLOSED'} ? 'badge bg-danger' :
                          'badge bg-secondary')">
                    </span>
                </td>
                <td>
                    <a th:href="@{'/appraisal/admin/cycle/edit/' + ${c.id}}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(cycles)}">
                <td colspan="5" class="text-center">
                    No cycles created yet.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>
