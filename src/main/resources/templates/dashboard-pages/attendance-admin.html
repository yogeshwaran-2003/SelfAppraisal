<style>
    .attendance-wrapper{
        max-width:1100px;
        margin:20px auto;
    }

    .attendance-title{
        font-size:22px;
        font-weight:600;
        margin-bottom:25px;
        color:#1e293b;
    }

    .attendance-card{
        border-radius:12px;
        padding:25px;
        background:#ffffff;
        box-shadow:0 4px 14px rgba(0,0,0,.08);
    }
</style>

<div class="attendance-wrapper">

    <div class="attendance-title">
        Attendance Report (Admin)
    </div>

    <div class="attendance-card">

        <form method="get"
              th:action="@{/attendance/admin}"
              class="row g-3 mb-4">

            <div class="col-md-4">
                <input type="number"
                       name="month"
                       min="1"
                       max="12"
                       th:value="${month}"
                       class="form-control"
                       placeholder="Month">
            </div>

            <div class="col-md-4">
                <input type="number"
                       name="year"
                       th:value="${year}"
                       class="form-control"
                       placeholder="Year">
            </div>

            <div class="col-md-4">
                <button class="btn btn-primary w-100">
                    View Report
                </button>
            </div>

        </form>

<!--        <table class="table table-bordered table-striped">-->
        <table id="attendanceTable"
               class="table table-bordered table-striped">

            <thead class="table-dark">
            <tr>
                <th>Employee</th>
                <th>Present</th>
                <th>Absent</th>
                <th>Half Day</th>
                <th>Leave</th>
                <th>Holiday</th>
                <th>Payable Days</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="row : ${report}">
                <td th:text="${row.employeeName}"></td>
                <td th:text="${row.present}"></td>
                <td th:text="${row.absent}"></td>
                <td th:text="${row.halfDay}"></td>
                <td th:text="${row.leave}"></td>
                <td th:text="${row.holiday}"></td>
                <td th:text="${row.payableDays}"></td>
            </tr>

            <tr th:if="${report == null || report.isEmpty()}">
                <td colspan="7" class="text-center text-muted">
                    No data available.
                </td>
            </tr>

            </tbody>

        </table>

        <div class="mt-3 text-end">
            <button class="btn btn-success"
                    onclick="exportAttendanceExcel()">
                <i class="fa fa-file-excel"></i> Export Excel
            </button>
        </div>
    </div>

</div>

<script>

    function exportAttendanceExcel(){

        let table = document.getElementById("attendanceTable");

        let html = table.outerHTML.replace(/ /g,'%20');

        let file = 'Attendance_Report.xls';

        let link = document.createElement("a");

        link.href = 'data:application/vnd.ms-excel,' + html;

        link.download = file;

        link.click();
    }

</script>
