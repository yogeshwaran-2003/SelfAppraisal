<!DOCTYPE html>
<html>
<head>
    <title>Company Setup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(120deg,#4e73df,#224abe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        .register-card{
            width:480px;
            background:white;
            border-radius:10px;
            padding:30px;
            box-shadow:0 0 25px rgba(0,0,0,.2);
        }

        .logo{
            text-align:center;
            font-size:22px;
            font-weight:bold;
            margin-bottom:20px;
        }

        input{
            height:42px;
        }

        button{
            height:45px;
        }

        .section{
            font-size:14px;
            font-weight:bold;
            margin-top:15px;
            margin-bottom:8px;
            color:#444;
        }

    </style>
</head>

<body>

<div class="register-card">

    <div class="logo">Company Setup</div>

    <form action="/register" method="post">

        <div class="section">Company Details</div>

        <input class="form-control mb-2" name="companyName" placeholder="Company Name" required>

        <input class="form-control mb-2" name="companyCode" placeholder="Company Code" required>

        <input class="form-control mb-2" name="registrationNo" placeholder="Registration Number" required>

        <input class="form-control mb-2" name="sector" placeholder="Sector (IT / Construction / etc)" required>

        <hr>

        <div class="section">First Admin Account</div>

        <input class="form-control mb-2" name="username" placeholder="Admin Username" required>

        <input type="password" class="form-control mb-3" name="password" placeholder="Password" required>

        <button class="btn btn-success w-100">Create Company</button>

    </form>

</div>

</body>
</html>
