<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HRMS Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            height:100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-container{
            height:100vh;
            display:flex;
        }

        /* LEFT SIDE */
        .login-left{
            width:55%;
            background:linear-gradient(135deg,#4e73df,#224abe);
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:80px;
        }

        .login-left h1{
            font-size:42px;
            font-weight:700;
            margin-bottom:15px;
        }

        .login-left p{
            font-size:18px;
            opacity:.9;
        }

        /* RIGHT SIDE */
        .login-right{
            width:45%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f8f9fc;
        }

        .login-card{
            width:360px;
        }

        .login-title{
            font-size:28px;
            font-weight:600;
            margin-bottom:25px;
        }

        .form-control{
            height:45px;
            border-radius:6px;
        }

        .btn-login{
            height:45px;
            font-weight:600;
            border-radius:6px;
        }

        .error{
            color:red;
            text-align:center;
            margin-top:10px;
        }

    </style>

</head>
<body>

<div class="login-container">

    <!-- LEFT PANEL -->
    <div class="login-left">
        <h1>TechNova Solutions Pvt Ltd</h1>
        <p>
            Employee Performance & Self Appraisal System
        </p>

        <p style="margin-top:30px;">
            Manage employee performance, reviews,
            goals and organizational growth efficiently.
        </p>
    </div>


    <!-- RIGHT PANEL -->
    <div class="login-right">

        <div class="login-card">

            <div class="login-title">
                Sign In
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Username"
                           required>
                </div>

                <div class="mb-3">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Password"
                           required>
                </div>

                <button class="btn btn-primary w-100 btn-login">
                    Login
                </button>

            </form>

            <p class="error"
               th:if="${param.error}">
                Invalid Username or Password
            </p>

        </div>

    </div>

</div>

</body>
</html>
