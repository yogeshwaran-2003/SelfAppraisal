<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title layout:title-pattern="$CONTENT_TITLE - Dashboard">Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- DataTables Export Buttons -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>


    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>

<style>
    body{
        margin:0;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background:#f4f6f9;
    }

    .wrapper{
        display:flex;
        height:100vh;
        overflow:hidden;
    }

/* ================= SIDEBAR ================= */
.sidebar{
    width:250px;
    background:linear-gradient(180deg,#0f172a,#020617);
    color:#e5e7eb;
    display:flex;
    flex-direction:column;
    padding:16px 0;
}

/* Sidebar title */
.sidebar h4{
    color:#ffffff;
    text-align:center;
    margin-bottom:20px;
    font-weight:600;
    letter-spacing:0.5px;
    padding-bottom:12px;
    border-bottom:1px solid #1e293b;
}

/* ================= MENU ================= */
.menu{
    padding:12px 22px;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:background .2s ease,color .2s ease;
}

/* Anchor inside menu */
.menu a{
    color:inherit;
    text-decoration:none;
    width:100%;
    display:block;
}

/* Hover */
.menu:hover{
    background:#1e293b;
    color:#ffffff;
}

/* Active menu */
.menu.active{
    background:#2563eb;
    color:#ffffff;
}

/* ================= DROPDOWN ================= */
.menu.dropdown{
    font-weight:500;
}

/* Arrow */
.menu .arrow{
    font-size:12px;
    color:#94a3b8;
    transition:transform .2s ease;
}

/* Rotate arrow on hover */
.menu.dropdown:hover .arrow{
    transform:rotate(180deg);
}

/* ================= SUBMENU ================= */
.submenu{
    display:none;
    background:#020617;
}

/* Show submenu on hover */
.menu.dropdown:hover + .submenu,
.submenu:hover{
    display:block;
}

/* Submenu items */
.submenu .menu.sub-item{
    padding:10px 36px;
    font-size:13px;
    color:#cbd5f5;
}

/* Submenu hover */
.submenu .menu.sub-item:hover{
    background:#1e293b;
    color:#ffffff;
}

/* Optional divider spacing */
.submenu + .menu{
    margin-top:2px;
}

    /* ===== MAIN ===== */
    .main{
        flex:1;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    /* ===== NAVBAR ===== */
    .navbar{
        background:white;
        padding:12px 24px;
        display:flex;
        justify-content:flex-end;
        align-items:center;
        border-bottom:1px solid #e5e7eb;
        box-shadow:0 1px 6px rgba(0,0,0,.05);
    }

    .navbar .company{
        font-weight:600;
        margin-right:20px;
        color:#1e293b;
    }

    .navbar .user{
        margin-right:10px;
        color:#334155;
    }

    .navbar .logout{
        font-size:13px;
        padding:4px 10px;
    }

    /* ===== CONTENT ===== */
    .content{
        padding:25px;
        overflow:auto;
        flex:1;
    }

    .card{
        border-radius:12px;
        box-shadow:0 4px 14px rgba(0,0,0,.08);
        border:none;
    }
</style>
<body>
<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h4>Self Appraisal</h4>

        <!-- Dashboard (All Authenticated Users) -->
        <div class="menu">
            <a th:href="@{/dashboard}">Dashboard</a>
        </div>

        <!-- Employee (Admin + Manager) -->
        <div class="menu"
             th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'')')}">
            <a th:href="@{/employees}">Employee</a>
        </div>

        <!-- Department (Admin Only) -->
        <div class="menu"
             th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/departments}">Department</a>
        </div>

        <!-- Projects Section (All Roles) -->
        <div class="menu dropdown"
             th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'',''EMPLOYEE'')')}">
            <span class="menu-title">Projects</span>
            <span class="arrow">▾</span>
        </div>

        <div class="submenu"
             th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'',''EMPLOYEE'')')}">

            <!-- Project (Admin + Manager Only) -->
            <div class="menu sub-item"
                 th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''MANAGER'')')}">
                <a th:href="@{/projects}">Project</a>
            </div>

            <!-- Task (All Roles) -->
            <div class="menu sub-item">
                <a th:href="@{/tasks}">Task</a>
            </div>

        </div>

        <!-- Self Appraisal (All Roles) -->
        <div class="menu">
            <a th:href="@{/appraisal}">Self Appraisal</a>
        </div>

        <div class="menu">
            <a th:href="@{/attendance}">Attendance</a>
        </div>

        <!-- Payroll (All Roles) -->
        <div class="menu">
            <a th:href="@{/payroll}">Payroll</a>
        </div>

        <!-- Clients (Admin Only) -->
        <div class="menu"
             th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/clients}">Clients</a>
        </div>

        <!-- Company (Admin Only) -->
        <div class="menu"
             th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/company}">Company</a>
        </div>

        <!-- Admin Section -->
        <div class="menu dropdown"
             th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <span class="menu-title">Admin</span>
            <span class="arrow">▾</span>
        </div>

        <div class="submenu"
             th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

            <div class="menu sub-item">
                <a th:href="@{/roles}">Role Management</a>
            </div>

            <div class="menu sub-item">
                <a th:href="@{/users}">User Management</a>
            </div>

        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="navbar">

            <!-- Company Name (temporary simple version) -->
            <span style="margin-right:10px"
                  th:text="'Welcome'">
            </span>

            <!-- Logged-in Username -->
            <span style="margin-right:10px"
                  th:text="${#authentication.name}">
            </span>

            <a th:href="@{/logout}"
               class="btn btn-danger btn-sm">
                Logout
            </a>

        </div>
        <!--  THIS IS RenderBody() -->
        <div class="content">
            <div th:replace="~{${content}}"></div>
        </div>
    </div>
</div>
</body>
</html>
